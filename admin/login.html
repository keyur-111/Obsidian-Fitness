<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Staff Login &mdash; OBSIDIAN FITNESS Admin
    </title>
    <meta name="description" content="Admin portal sign-in.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
  </head>
  <body data-page="login">
    <div class="min-vh-100 d-flex align-items-center justify-content-center bg-soft p-3">
      <form id="loginForm" class="card-of p-5 rise" style="max-width:440px;width:100%;height:auto" novalidate>
        <div class="text-center mb-4">
          <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
            <polygon points="20,2 36,14 30,38 10,38 4,14" fill="#eef0e8" stroke="#2c3a33" stroke-width="1.5"/>
            <polygon points="20,2 26,20 20,38 14,20" fill="#6b8f78"/>
            <line x1="4" y1="14" x2="36" y2="14" stroke="#2c3a33" stroke-opacity=".3"/>
          </svg>
          <h1 class="h3 mt-3">
            OBSIDIAN FITNESS
          </h1>
          <p class="eyebrow">
            Admin Portal
          </p>
        </div>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="email">Staff Email</label>
            <input class="form-control" type="email" id="email" name="email" placeholder="" data-rule="email">
            <div class="invalid-feedback">
            </div>
          </div>
          <div class="col-12">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" placeholder="" data-rule="password">
            <div class="invalid-feedback">
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-of btn-lg w-100" type="submit">
              Sign In
            </button>
          </div>
        </div>
        <p class="small text-muted-soft text-center mt-3 mb-1">
          Demo: admin@obsidianfitness.in / obsidian123
        </p>
        <p class="text-center small mb-0">
          <a href="../index.html">
            &larr; Back to website
          </a>
        </p>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="../assets/js/app.js">
    </script>
  </body>
</html>
